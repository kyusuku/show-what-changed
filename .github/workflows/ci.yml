name: Verify candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove hosted runner Git LFS filters
        run: |
          git config --show-origin --show-scope --name-only --get-regexp '^filter\.lfs\.' || test "$?" -eq 1
          for scope in global system; do
            if git config "--$scope" --get-regexp '^filter\.lfs\.' > /dev/null; then
              if [ "$scope" = system ]; then
                sudo git config --system --remove-section filter.lfs
              else
                git config --global --remove-section filter.lfs
              fi
            else
              config_status=$?
              if [ "$config_status" -ne 1 ]; then exit "$config_status"; fi
            fi
          done
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Pin package-manager prerequisites
        run: npm install --global npm@11.12.1 pnpm@11.9.0
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg procps build-essential pkg-config libtirpc-dev libselinux1-dev curl ca-certificates apparmor
          sh scripts/linux-gate/install-lsof.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install macOS media prerequisite
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install tool dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Permit pinned Chromium sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chromium_shells=( "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell )
          if [ "${#chromium_shells[@]}" -ne 1 ] || [ ! -x "${chromium_shells[0]}" ]; then
            echo "Expected exactly one installed Chromium headless shell." >&2
            exit 1
          fi
          chromium_shell=$(realpath "${chromium_shells[0]}")
          sudo tee /etc/apparmor.d/show-what-changed-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile show-what-changed-chromium "$chromium_shell" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/show-what-changed-chromium
      - name: Install pinned Chromium on macOS
        if: runner.os == 'macOS'
        run: node node_modules/playwright/cli.js install chromium
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
          npm run schema:check
      - name: Verify sandboxed Chromium prerequisite
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { childEnvironment } from './dist/runtime/process-table.js';
          const server = await chromium.launchServer({ headless: true, chromiumSandbox: true, timeout: 30_000, env: childEnvironment('ci-browser-prerequisite') });
          try { console.log('Sandboxed Chromium launch succeeded.'); }
          finally { await server.close(); }
          NODE
      - name: Pack the candidate
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --pack-destination "$RUNNER_TEMP/candidate" --json > "$RUNNER_TEMP/candidate/pack.json"
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';
          import { basename, resolve } from 'node:path';
          const packs = JSON.parse(await readFile(resolve(process.env.RUNNER_TEMP, 'candidate/pack.json'), 'utf8'));
          const filename = packs?.[0]?.filename;
          if (!Array.isArray(packs) || packs.length !== 1 || typeof filename !== 'string' || basename(filename) !== filename || !filename.endsWith('.tgz') || /[\r\n]/.test(filename)) {
            throw new Error('npm must produce exactly one local package archive.');
          }
          await appendFile(process.env.GITHUB_ENV, `SWC_CANDIDATE_TARBALL=${resolve(process.env.RUNNER_TEMP, 'candidate', filename)}\n`);
          NODE
      - name: Bind the candidate to the tested source
        run: node scripts/verify-package-source.mjs "$SWC_CANDIDATE_TARBALL" "$RUNNER_TEMP/package-source-binding"
      - name: Verify the installed candidate with completed-run diagnostics
        run: |
          smoke_status=0
          node scripts/release-smoke.mjs "$SWC_CANDIDATE_TARBALL" "$RUNNER_TEMP/package-smoke" || smoke_status=$?
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import { join } from 'node:path';
          const output = join(process.env.RUNNER_TEMP, 'package-smoke');
          const report = JSON.parse(await readFile(join(output, 'report.json'), 'utf8'));
          const clip = (value, limit) => String(value ?? '').slice(-limit);
          const emit = (value) => {
            let line = JSON.stringify(value);
            for (const path of [report.root, process.env.RUNNER_TEMP, process.env.GITHUB_WORKSPACE].filter(Boolean)) line = line.split(path).join('<workspace>');
            console.log(line);
          };
          const summary = (result) => result ? { argv: result.argv, code: result.code, signal: result.signal, timedOut: result.timedOut, overflow: result.overflow, elapsedMs: result.elapsedMs, stdout: clip(result.stdout, 16000), stderr: clip(result.stderr, 2000) } : null;
          emit({ diagnostic: 'installed-smoke-report', status: report.status, candidate: report.candidate ? { sha256: report.candidate.sha256, bytes: report.candidate.bytes } : null, error: report.error ? { message: clip(report.error.message, 4000), stack: clip(report.error.stack, 4000), command: summary(report.error.command) } : null });
          for (const name of (await readdir(output)).filter(name => name.endsWith('.json') && name !== 'report.json').sort()) {
            const value = JSON.parse(await readFile(join(output, name), 'utf8'));
            emit({ diagnostic: 'completed-command', name, argv: value.argv, code: value.code, signal: value.signal, timedOut: value.timedOut, overflow: value.overflow, elapsedMs: value.elapsedMs });
          }
          const runs = join(report.root, 'app/.show-what-changed/runs');
          let names = [];
          try { names = await readdir(runs); } catch (error) { if (error.code !== 'ENOENT') throw error; }
          for (const name of names.slice(0, 10)) {
            for (const file of ['manifest.json', 'capture.json']) {
              try {
                const value = JSON.parse(await readFile(join(runs, name, file), 'utf8'));
                emit({ diagnostic: 'completed-artifact', name, file, status: value.status, state: value.state, exitCode: value.exitCode, comparisonOutcome: value.comparisonOutcome, encodingOutcome: value.encodingOutcome, cleanupOutcome: value.cleanupOutcome, errors: value.errors, scenarios: value.scenarios?.map(row => ({ id: row.id, outcome: row.outcome, errors: row.errors, steps: row.steps.map(step => ({ id: step.id, op: step.op, before: { status: step.before?.status, reasonCode: step.before?.reasonCode, elapsedMs: step.before?.elapsedMs }, after: { status: step.after?.status, reasonCode: step.after?.reasonCode, elapsedMs: step.after?.elapsedMs } })) })) });
              } catch (error) { emit({ diagnostic: 'artifact-unavailable', name, file, code: error.code ?? 'INVALID_JSON' }); }
            }
          }
          NODE
          exit "$smoke_status"
