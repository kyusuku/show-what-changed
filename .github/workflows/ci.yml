name: Diagnose recorder fixture timing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorder-fixtures:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Pin npm 11.12.1
        run: npm install --global npm@11.12.1
      - name: Install tool dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: node node_modules/playwright/cli.js install chromium
      - name: Run the complete real Chromium recorder integration file
        timeout-minutes: 8
        run: node node_modules/vitest/vitest.mjs run test/integration/recorder.test.ts --maxWorkers=1 --no-file-parallelism --reporter=verbose
