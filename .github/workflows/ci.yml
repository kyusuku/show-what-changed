name: Narrow composer diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composer-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrow:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove hosted runner Git LFS filters
        run: |
          for scope in global system; do
            if git config "--$scope" --get-regexp '^filter\.lfs\.' > /dev/null; then
              if [ "$scope" = system ]; then
                sudo git config --system --remove-section filter.lfs
              else
                git config --global --remove-section filter.lfs
              fi
            else
              config_status=$?
              if [ "$config_status" -ne 1 ]; then exit "$config_status"; fi
            fi
          done
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Pin package manager prerequisites
        run: npm install --global npm@11.12.1 pnpm@11.9.0
      - name: Install media prerequisite
        run: brew install ffmpeg
      - name: Install tool dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: node node_modules/playwright/cli.js install chromium
      - name: Check diagnostic types
        run: npm run typecheck
      - name: Reproduce focused narrow capture at original limits
        shell: bash
        run: |
          for diagnostic_attempt in 1 2 3; do
            echo "Focused diagnostic attempt $diagnostic_attempt"
            node node_modules/vitest/vitest.mjs run test/integration/composer-media.test.ts -t 'encodes actual odd narrow motion viewports' --maxWorkers=1 --no-file-parallelism
          done
      - name: Reproduce original prerequisite files and composer order
        if: success()
        run: node node_modules/vitest/vitest.mjs run test/integration/recorder.test.ts test/integration/adversarial-gaps.test.ts test/integration/composer-media.test.ts --maxWorkers=1 --no-file-parallelism
