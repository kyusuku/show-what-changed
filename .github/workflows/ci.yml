name: Verify candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-diagnostic:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove hosted runner Git LFS filters
        run: |
          git config --show-origin --show-scope --name-only --get-regexp '^filter\.lfs\.' || test "$?" -eq 1
          for scope in global system; do
            if git config "--$scope" --get-regexp '^filter\.lfs\.' > /dev/null; then
              if [ "$scope" = system ]; then
                sudo git config --system --remove-section filter.lfs
              else
                git config --global --remove-section filter.lfs
              fi
            else
              config_status=$?
              if [ "$config_status" -ne 1 ]; then exit "$config_status"; fi
            fi
          done
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Pin npm 11.12.1
        run: npm install --global npm@11.12.1
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install tool dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: node node_modules/playwright/cli.js install chromium
      - name: Typecheck diagnostic instrumentation
        run: npm run typecheck
      - name: Run focused provenance capture with existing deadlines
        run: node node_modules/vitest/vitest.mjs run test/integration/provenance-capture.test.ts --maxWorkers=1 --no-file-parallelism
