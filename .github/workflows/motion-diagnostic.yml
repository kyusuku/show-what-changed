name: Diagnose installed motion

on:
  push:
    branches: [release/motion-diagnostic]

permissions:
  contents: read

concurrency:
  group: motion-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove hosted runner Git LFS filters
        run: |
          git config --show-origin --show-scope --name-only --get-regexp '^filter\.lfs\.' || test "$?" -eq 1
          for scope in global system; do
            if git config "--$scope" --get-regexp '^filter\.lfs\.' > /dev/null; then
              if [ "$scope" = system ]; then
                sudo git config --system --remove-section filter.lfs
              else
                git config --global --remove-section filter.lfs
              fi
            else
              config_status=$?
              if [ "$config_status" -ne 1 ]; then exit "$config_status"; fi
            fi
          done
      - name: Set up Node 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Pin package-manager prerequisites
        run: npm install --global npm@11.12.1 pnpm@11.9.0
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg procps build-essential pkg-config libtirpc-dev libselinux1-dev curl ca-certificates apparmor
          sh scripts/linux-gate/install-lsof.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install macOS media prerequisite
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Report hosted resource characteristics
        run: |
          node --input-type=module <<'NODE'
          import { arch, availableParallelism, cpus, loadavg, platform, totalmem } from 'node:os';
          console.log(JSON.stringify({ architecture: arch(), platform: platform(), parallelism: availableParallelism(), cpuModels: [...new Set(cpus().map(cpu => cpu.model))], memoryBytes: totalmem(), loadAverage: loadavg() }));
          NODE
      - name: Install tool dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Install pinned Chromium on macOS
        if: runner.os == 'macOS'
        run: node node_modules/playwright/cli.js install chromium
      - name: Permit pinned Chromium sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chromium_shells=( "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell )
          if [ "${#chromium_shells[@]}" -ne 1 ] || [ ! -x "${chromium_shells[0]}" ]; then
            echo "Expected exactly one installed Chromium headless shell." >&2
            exit 1
          fi
          chromium_shell=$(realpath "${chromium_shells[0]}")
          sudo tee /etc/apparmor.d/show-what-changed-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile show-what-changed-chromium "$chromium_shell" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/show-what-changed-chromium
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
          npm run schema:check
      - name: Verify sandboxed Chromium prerequisite
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { childEnvironment } from './dist/runtime/process-table.js';
          const server = await chromium.launchServer({ headless: true, chromiumSandbox: true, timeout: 30_000, env: childEnvironment('ci-browser-prerequisite') });
          try { console.log('Sandboxed Chromium launch succeeded.'); }
          finally { await server.close(); }
          NODE
      - name: Fetch and install the exact published archive without smoke scenarios
        run: |
          mkdir -p "$RUNNER_TEMP/motion-diagnostic/candidate"
          npm pack show-what-changed@0.1.0 --ignore-scripts --pack-destination "$RUNNER_TEMP/motion-diagnostic/candidate" --json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { hash, installCandidate } from './scripts/release-harness.mjs';
          const root = join(process.env.RUNNER_TEMP, 'motion-diagnostic');
          const archive = join(root, 'candidate/show-what-changed-0.1.0.tgz');
          assert.equal(hash(await readFile(archive)), '0ca52c4395e27c9282489375ffd5c1924c718f829d65818c2284c367cdb9ed31', 'Diagnostic archive must match the exact published candidate.');
          const candidate = await installCandidate(archive, root, join(root, 'install-report'));
          console.log(JSON.stringify({ sourceCommit: process.env.GITHUB_SHA, candidateSha256: candidate.sha256, bytes: candidate.bytes, installedRoot: candidate.packageRoot, diagnosticOnly: true }));
          NODE
      - name: Profile one untouched published desktop source capture
        run: |
          node scripts/macos-capture-diagnostic.mjs \
            "$RUNNER_TEMP/motion-diagnostic/installed/node_modules/show-what-changed" \
            "$RUNNER_TEMP/motion-diagnostic/profile" \
            "$RUNNER_TEMP/motion-diagnostic/candidate/show-what-changed-0.1.0.tgz"
      - name: Remove diagnostic installation and generated artifacts
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/motion-diagnostic"
