<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#172033;font:18px sans-serif;overflow:hidden}.secret{position:absolute;left:0;top:0;width:140px;height:100px;background:red;color:blue}.mover{position:absolute;top:140px;left:50px;width:28px;height:28px;background:#00ed00}.native{position:absolute;top:210px;left:50px;width:28px;height:28px;background:#fc9e25;transition:transform 1.2s ease-in-out}.pulse{position:absolute;left:400px;top:40px;width:90px;height:40px;background:#333}.pulse.on{background:#f000f0}button{position:absolute;top:100px;left:350px}.scroll{position:absolute;top:290px;left:180px;width:500px;height:130px;overflow:auto;border:2px solid #222}.content{height:1300px;background:repeating-linear-gradient(#fff 0px,#fff 60px,#6daee3 60px,#6daee3 100px)}.running .mover{animation:travel 3s linear forwards}.running .native{transform:translateX(600px)}@keyframes travel{from{transform:translateX(0)}to{transform:translateX(600px)}}
</style></head><body><div class="secret">SYNTHETIC PRIVATE STRING</div><button onclick="start()">Start motion</button><div class="pulse"></div><div class="mover"></div><div class="native"></div><div class="scroll" data-testid="inner-scroll"><div class="content">Inner smooth scroll</div></div><script>function start(){document.body.classList.add('running');for(const delay of [100,1100,2100]){setTimeout(()=>document.querySelector('.pulse').classList.add('on'),delay);setTimeout(()=>document.querySelector('.pulse').classList.remove('on'),delay+120);}}</script></body></html>
